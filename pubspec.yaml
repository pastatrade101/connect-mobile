name: makutano_connect
description: Makutano Connect for phones — the inbox, and the notification that brings you to it.
publish_to: 'none'
version: 1.1.2+10

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  flutter_local_notifications: ^18.0.1
  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_animate: ^4.5.2
  # Live vehicle tracking. flutter_map is pure Dart and needs no API key, which is
  # why the web side chose Leaflet + OpenStreetMap for the same job — one tile
  # source, one licence, nothing to bill.
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

# The mark on the home screen, generated from the same file the login screen uses.
flutter_launcher_icons:
  image_path: assets/logo.png
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/logo.png

flutter:
  uses-material-design: true
  fonts:
    # Inter, as ONE family holding four weights.
    #
    # These are the Google Fonts files, bundled rather than downloaded: the
    # google_fonts package fetches at first launch and renders the platform face
    # until it lands, and most of this app's operators are on Tanzanian mobile
    # data where that wait is not brief.
    #
    # Registered here rather than through GoogleFonts.inter() because that API
    # gives every WEIGHT its own family — Inter_regular, Inter_600, Inter_700 —
    # so `style.copyWith(fontWeight: w700)` asks a family holding a single face
    # for a weight it does not contain, and the text draws Regular while the code
    # says bold. Measured, not assumed: bodyMedium.copyWith(w700) came back as
    # family Inter_regular. There are 139 fontWeight: call sites in lib/; under
    # one multi-weight family every one of them resolves correctly and unchanged.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  assets:
    - assets/logo.png
    - assets/fonts/
    # Optional Rive artwork. The folder is declared so a .riv dropped in here is
    # picked up without touching pubspec; RiveArt falls back when it is empty.
    - assets/rive/
